<!DOCTYPE html>
<html><body>
<div id="output"></div>
<script>
async function gen() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
    <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c6aff"/><stop offset="100%" stop-color="#5046e5"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/></linearGradient></defs>
    <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#bg)"/>
    <path d="M38 30h52a4 4 0 0 1 4 4v64l-30-20-30 20V34a4 4 0 0 1 4-4z" fill="url(#ribbon)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.5"/>
    <path d="M64 46l4.2 12.8h13.6l-11 8 4.2 13-11-8-11 8 4.2-13-11-8h13.6z" fill="#ffffff" opacity="0.85"/>
    <path d="M64 46l4.2 12.8h13.6l-11 8 4.2 13-11-8-11 8 4.2-13-11-8h13.6z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  </svg>`;

  const out = document.getElementById('output');
  for (const size of [16,48,128]) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    const img = new Image();
    const url = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml'}));
    await new Promise(r => { img.onload = () => { ctx.drawImage(img,0,0,size,size); r(); }; img.src = url; });
    c.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'icon' + size + '.png';
      out.appendChild(a);
      a.click();
    });
  }
}
gen();
</script>
</body></html>
