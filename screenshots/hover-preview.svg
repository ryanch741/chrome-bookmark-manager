<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <linearGradient id="previewGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30,30,60,0.92)"/>
      <stop offset="100%" stop-color="rgba(20,20,45,0.95)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c6aff"/>
      <stop offset="100%" stop-color="#b86aff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="32" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Radial decoration -->
  <ellipse cx="256" cy="240" rx="400" ry="400" fill="rgba(124,106,255,0.08)"/>
  <ellipse cx="1024" cy="560" rx="400" ry="400" fill="rgba(184,106,255,0.06)"/>

  <!-- Top Bar -->
  <g transform="translate(16, 10)">
    <rect x="0" y="0" width="1248" height="44" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#cardShadow)"/>
    <text x="18" y="28" font-size="17" font-weight="700" fill="#f0f0f0">📑 书签管理</text>
    <rect x="364" y="8" width="520" height="28" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="376" y="26" font-size="12" fill="rgba(255,255,255,0.35)">🔍 搜索书签名称或分组...</text>
    <rect x="1140" y="5" width="34" height="34" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="1153" y="28" font-size="16" fill="#f0f0f0" text-anchor="middle">✏️</text>
    <rect x="1180" y="5" width="34" height="34" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="1193" y="28" font-size="16" fill="#f0f0f0" text-anchor="middle">☀️</text>
    <rect x="1220" y="5" width="34" height="34" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="1233" y="28" font-size="16" fill="#f0f0f0" text-anchor="middle">🖼</text>
  </g>

  <!-- Pinned Bookmarks (dimmed, background) -->
  <g transform="translate(126, 80)" opacity="0.4">
    <rect x="0" y="0" width="1028" height="74" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="12" y="6" width="80" height="62" rx="9" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="52" cy="24" r="10" fill="#4285F4"/>
    <text x="52" y="29" font-size="10" font-weight="600" fill="white" text-anchor="middle">G</text>
    <rect x="100" y="6" width="80" height="62" rx="9" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="140" cy="24" r="10" fill="#EA4335"/>
    <text x="140" y="29" font-size="10" font-weight="600" fill="white" text-anchor="middle">G</text>
    <rect x="188" y="6" width="80" height="62" rx="9" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="228" cy="24" r="10" fill="#333"/>
    <text x="228" y="29" font-size="10" font-weight="600" fill="white" text-anchor="middle">G</text>
    <rect x="276" y="6" width="80" height="62" rx="9" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="316" cy="24" r="10" fill="#10A37F"/>
    <text x="316" y="29" font-size="10" font-weight="600" fill="white" text-anchor="middle">C</text>
  </g>

  <!-- Group Cards (dimmed except first) -->
  <!-- 开发工具 - hovered state with accent border -->
  <g transform="translate(126, 174)">
    <rect x="0" y="0" width="160" height="130" rx="16" fill="rgba(124,106,255,0.18)" stroke="#7c6aff" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="80" y="38" font-size="28" text-anchor="middle">📂</text>
    <text x="80" y="70" font-size="12" font-weight="600" fill="#f0f0f0" text-anchor="middle">开发工具</text>
    <text x="80" y="90" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="middle">5 个书签 · 2 个子分组</text>
  </g>

  <!-- Other dimmed cards -->
  <g transform="translate(300, 174)" opacity="0.3">
    <rect x="0" y="0" width="160" height="130" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="80" y="38" font-size="28" text-anchor="middle">📂</text>
    <text x="80" y="70" font-size="12" font-weight="600" fill="#f0f0f0" text-anchor="middle">设计资源</text>
    <text x="80" y="90" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="middle">4 个书签</text>
  </g>
  <g transform="translate(474, 174)" opacity="0.3">
    <rect x="0" y="0" width="160" height="130" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="80" y="38" font-size="28" text-anchor="middle">📂</text>
    <text x="80" y="70" font-size="12" font-weight="600" fill="#f0f0f0" text-anchor="middle">新闻与博客</text>
    <text x="80" y="90" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="middle">3 个书签</text>
  </g>

  <!-- ===== Hover Preview Popup ===== -->
  <g transform="translate(280, 140)" filter="url(#shadow)">
    <rect x="0" y="0" width="680" height="460" rx="14" fill="url(#previewGlass)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="0" y="0" width="680" height="460" rx="14" fill="url(#previewGlass)" opacity="0.5"/>

    <!-- Preview Title -->
    <text x="20" y="32" font-size="16" font-weight="700" fill="#f0f0f0">📂 开发工具</text>
    <line x1="20" y1="48" x2="660" y2="48" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Column 1 bookmarks -->
    <g transform="translate(20, 62)">
      <!-- GitHub -->
      <rect x="0" y="0" width="200" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
      <circle cx="12" cy="14" r="8" fill="#333"/>
      <text x="12" y="18" font-size="8" font-weight="600" fill="white" text-anchor="middle">G</text>
      <text x="28" y="18" font-size="12" fill="#f0f0f0">GitHub</text>

      <!-- Stack Overflow -->
      <rect x="0" y="34" width="200" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
      <circle cx="12" cy="48" r="8" fill="#F48024"/>
      <text x="12" y="52" font-size="8" font-weight="600" fill="white" text-anchor="middle">S</text>
      <text x="28" y="52" font-size="12" fill="#f0f0f0">Stack Overflow</text>

      <!-- MDN -->
      <rect x="0" y="68" width="200" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
      <circle cx="12" cy="82" r="8" fill="#8B5CF6"/>
      <text x="12" y="86" font-size="8" font-weight="600" fill="white" text-anchor="middle">M</text>
      <text x="28" y="86" font-size="12" fill="#f0f0f0">MDN Web Docs</text>
    </g>

    <!-- Column 2 bookmarks -->
    <g transform="translate(240, 62)">
      <!-- CodeSandbox -->
      <rect x="0" y="0" width="200" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
      <circle cx="12" cy="14" r="8" fill="#000"/>
      <text x="12" y="18" font-size="8" font-weight="600" fill="white" text-anchor="middle">C</text>
      <text x="28" y="18" font-size="12" fill="#f0f0f0">CodeSandbox</text>

      <!-- npm -->
      <rect x="0" y="34" width="200" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
      <circle cx="12" cy="48" r="8" fill="#CB3837"/>
      <text x="12" y="52" font-size="8" font-weight="600" fill="white" text-anchor="middle">n</text>
      <text x="28" y="52" font-size="12" fill="#f0f0f0">npm</text>
    </g>

    <!-- Sub-folders section -->
    <g transform="translate(20, 170)">
      <line x1="0" y1="0" x2="640" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

      <!-- React 资源 sub-folder -->
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="200" height="36" rx="8" fill="rgba(255,255,255,0.05)"/>
        <text x="12" y="16" font-size="10" fill="rgba(255,255,255,0.5)">▶</text>
        <text x="28" y="16" font-size="12" font-weight="500" fill="rgba(255,255,255,0.65)">📂 React 资源 (2)</text>

        <!-- Expanded sub-folder content -->
        <g transform="translate(0, 40)">
          <rect x="0" y="0" width="200" height="26" rx="4" fill="transparent"/>
          <circle cx="20" cy="13" r="6" fill="#61DAFB"/>
          <text x="20" y="17" font-size="7" font-weight="600" fill="#000" text-anchor="middle">R</text>
          <text x="34" y="17" font-size="11" fill="#f0f0f0">React 官方文档</text>

          <rect x="0" y="28" width="200" height="26" rx="4" fill="transparent"/>
          <circle cx="20" cy="41" r="6" fill="#000"/>
          <text x="20" y="45" font-size="7" font-weight="600" fill="white" text-anchor="middle">N</text>
          <text x="34" y="45" font-size="11" fill="#f0f0f0">Next.js</text>
        </g>
      </g>

      <!-- CSS 工具 sub-folder -->
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="200" height="36" rx="8" fill="rgba(255,255,255,0.05)"/>
        <text x="12" y="16" font-size="10" fill="rgba(255,255,255,0.5)">▶</text>
        <text x="28" y="16" font-size="12" font-weight="500" fill="rgba(255,255,255,0.65)">📂 CSS 工具 (2)</text>

        <!-- Expanded sub-folder content -->
        <g transform="translate(0, 40)">
          <rect x="0" y="0" width="200" height="26" rx="4" fill="transparent"/>
          <circle cx="20" cy="13" r="6" fill="#06B6D4"/>
          <text x="20" y="17" font-size="7" font-weight="600" fill="white" text-anchor="middle">T</text>
          <text x="34" y="17" font-size="11" fill="#f0f0f0">Tailwind CSS</text>

          <rect x="0" y="28" width="200" height="26" rx="4" fill="transparent"/>
          <circle cx="20" cy="41" r="6" fill="#FF6C37"/>
          <text x="20" y="45" font-size="7" font-weight="600" fill="white" text-anchor="middle">C</text>
          <text x="34" y="45" font-size="11" fill="#f0f0f0">CSS-Tricks</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Stats Footer -->
  <g transform="translate(16, 760)">
    <rect x="0" y="0" width="1248" height="28" rx="10" fill="url(#glass)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="460" y="18" font-size="12" fill="rgba(255,255,255,0.35)" text-anchor="middle">共 9 个分组 · 29 个书签</text>
    <rect x="580" y="3" height="22" width="100" rx="8" fill="url(#accent)"/>
    <text x="630" y="17" font-size="13" font-weight="600" fill="white" text-anchor="middle">❤️ 打赏支持</text>
  </g>
</svg>
