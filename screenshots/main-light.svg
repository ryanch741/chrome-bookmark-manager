<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef0f7"/>
      <stop offset="50%" stop-color="#d5d8ec"/>
      <stop offset="100%" stop-color="#e2e5f2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.45)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c4fdb"/>
      <stop offset="100%" stop-color="#9b4ddb"/>
    </linearGradient>
    <filter id="glassShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.06)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Radial decoration -->
  <ellipse cx="256" cy="240" rx="400" ry="400" fill="rgba(92,79,219,0.05)"/>
  <ellipse cx="1024" cy="560" rx="400" ry="400" fill="rgba(155,77,219,0.04)"/>

  <!-- Top Bar -->
  <g transform="translate(16, 10)">
    <rect x="0" y="0" width="1248" height="44" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.7)" stroke-width="1" filter="url(#glassShadow)"/>

    <!-- App Title -->
    <text x="18" y="28" font-size="17" font-weight="700" fill="#1a1a2e">📑 书签管理</text>

    <!-- Search Box -->
    <rect x="364" y="8" width="520" height="28" rx="10" fill="rgba(255,255,255,0.6)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
    <text x="376" y="26" font-size="12" fill="rgba(0,0,0,0.32)">🔍 搜索书签名称或分组...</text>

    <!-- Action Buttons -->
    <rect x="1140" y="5" width="34" height="34" rx="8" fill="rgba(255,255,255,0.6)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
    <text x="1153" y="28" font-size="16" fill="#1a1a2e" text-anchor="middle">✏️</text>

    <rect x="1180" y="5" width="34" height="34" rx="8" fill="rgba(255,255,255,0.6)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
    <text x="1193" y="28" font-size="16" fill="#1a1a2e" text-anchor="middle">🌙</text>

    <rect x="1220" y="5" width="34" height="34" rx="8" fill="rgba(255,255,255,0.6)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
    <text x="1233" y="28" font-size="16" fill="#1a1a2e" text-anchor="middle">🖼</text>
  </g>

  <!-- Pinned Bookmarks -->
  <g transform="translate(126, 80)">
    <rect x="0" y="0" width="1028" height="74" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.7)" stroke-width="1" filter="url(#glassShadow)"/>

    <!-- Google -->
    <a href="#">
      <rect x="12" y="6" width="80" height="62" rx="9" fill="rgba(255,255,255,0.6)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
      <circle cx="52" cy="24" r="10" fill="#4285F4"/>
      <text x="52" y="29" font-size="10" font-weight="600" fill="white" text-anchor="middle">G</text>
      <text x="52" cy="44" y="50" font-size="11" fill="#1a1a2e" text-anchor="middle">Google</text>
    </a>

    <!-- Gmail -->
    <a href="#">
      <rect x="100" y="6" width="80" height="62" rx="9" fill="rgba(255,255,255,0.6)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
      <circle cx="140" cy="24" r="10" fill="#EA4335"/>
      <text x="140" y="29" font-size="10" font-weight="600" fill="white" text-anchor="middle">G</text>
      <text x="140" y="50" font-size="11" fill="#1a1a2e" text-anchor="middle">Gmail</text>
    </a>

    <!-- GitHub -->
    <a href="#">
      <rect x="188" y="6" width="80" height="62" rx="9" fill="rgba(255,255,255,0.6)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
      <circle cx="228" cy="24" r="10" fill="#333"/>
      <text x="228" y="29" font-size="10" font-weight="600" fill="white" text-anchor="middle">G</text>
      <text x="228" y="50" font-size="11" fill="#1a1a2e" text-anchor="middle">GitHub</text>
    </a>

    <!-- ChatGPT -->
    <a href="#">
      <rect x="276" y="6" width="80" height="62" rx="9" fill="rgba(255,255,255,0.6)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
      <circle cx="316" cy="24" r="10" fill="#10A37F"/>
      <text x="316" y="29" font-size="10" font-weight="600" fill="white" text-anchor="middle">C</text>
      <text x="316" y="50" font-size="11" fill="#1a1a2e" text-anchor="middle">ChatGPT</text>
    </a>
  </g>

  <!-- Group Cards -->
  <g transform="translate(126, 174)">

    <!-- 开发工具 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="130" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.7)" stroke-width="1" filter="url(#glassShadow)"/>
      <text x="80" y="38" font-size="28" text-anchor="middle">📂</text>
      <text x="80" y="70" font-size="12" font-weight="600" fill="#1a1a2e" text-anchor="middle">开发工具</text>
      <text x="80" y="90" font-size="11" fill="rgba(0,0,0,0.32)" text-anchor="middle">5 个书签 · 2 个子分组</text>
    </g>

    <!-- 设计资源 -->
    <g transform="translate(174, 0)">
      <rect x="0" y="0" width="160" height="130" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.7)" stroke-width="1" filter="url(#glassShadow)"/>
      <text x="80" y="38" font-size="28" text-anchor="middle">📂</text>
      <text x="80" y="70" font-size="12" font-weight="600" fill="#1a1a2e" text-anchor="middle">设计资源</text>
      <text x="80" y="90" font-size="11" fill="rgba(0,0,0,0.32)" text-anchor="middle">4 个书签</text>
    </g>

    <!-- 新闻与博客 -->
    <g transform="translate(348, 0)">
      <rect x="0" y="0" width="160" height="130" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.7)" stroke-width="1" filter="url(#glassShadow)"/>
      <text x="80" y="38" font-size="28" text-anchor="middle">📂</text>
      <text x="80" y="70" font-size="12" font-weight="600" fill="#1a1a2e" text-anchor="middle">新闻与博客</text>
      <text x="80" y="90" font-size="11" fill="rgba(0,0,0,0.32)" text-anchor="middle">3 个书签 · 1 个子分组</text>
    </g>

    <!-- 娱乐 -->
    <g transform="translate(522, 0)">
      <rect x="0" y="0" width="160" height="130" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.7)" stroke-width="1" filter="url(#glassShadow)"/>
      <text x="80" y="38" font-size="28" text-anchor="middle">📂</text>
      <text x="80" y="70" font-size="12" font-weight="600" fill="#1a1a2e" text-anchor="middle">娱乐</text>
      <text x="80" y="90" font-size="11" fill="rgba(0,0,0,0.32)" text-anchor="middle">3 个书签</text>
    </g>

    <!-- AI 工具 -->
    <g transform="translate(696, 0)">
      <rect x="0" y="0" width="160" height="130" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.7)" stroke-width="1" filter="url(#glassShadow)"/>
      <text x="80" y="38" font-size="28" text-anchor="middle">📂</text>
      <text x="80" y="70" font-size="12" font-weight="600" fill="#1a1a2e" text-anchor="middle">AI 工具</text>
      <text x="80" y="90" font-size="11" fill="rgba(0,0,0,0.32)" text-anchor="middle">4 个书签</text>
    </g>
  </g>

  <!-- Stats Footer -->
  <g transform="translate(16, 760)">
    <rect x="0" y="0" width="1248" height="28" rx="10" fill="url(#glass)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
    <text x="460" y="18" font-size="12" fill="rgba(0,0,0,0.32)" text-anchor="middle">共 9 个分组 · 29 个书签</text>
    <rect x="580" y="3" height="22" width="100" rx="8" fill="url(#accent)"/>
    <text x="630" y="17" font-size="13" font-weight="600" fill="white" text-anchor="middle">❤️ 打赏支持</text>
  </g>
</svg>
